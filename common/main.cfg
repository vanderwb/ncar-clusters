SPACKLOT_CLUSTER=$SPACKLOT_DEPLOYMENT_NAME
SPACKLOT_CLUSTERVERSION=$SPACKLOT_DEPLOYMENT_DATE
SPACKLOT_CORE_GCC=$SPACKLOT_SYSTEM_GCC
SPACKLOT_GPU_TYPE=none
SPACKLOT_USE_PREFERRED=false

if [[ $(hostname) =~ ^(ca|cr) ]]; then
    SPACKLOT_TMPROOT=/glade/derecho/scratch
    SPACKLOT_BUILD_HOSTS=crlogin1,crlogin2,crlogin3
elif [[ $(hostname) == de* ]]; then
    SPACKLOT_TMPROOT=/glade/derecho/scratch
    SPACKLOT_BUILD_HOSTS=derecho1,derecho2,derecho3,derecho4,derecho5,derecho6,derecho7,derecho8
elif [[ $(hostname) == gu* ]]; then
    SPACKLOT_TMPROOT=/glade/gust/scratch
    SPACKLOT_BUILD_HOSTS=gust01,gust02
fi

if [[ $SPACKLOT_DEPLOY_TYPE == production ]]; then
    SPACKLOT_ROOT_PUBLIC=/glade/u/apps/$SPACKLOT_HOST
else
    SPACKLOT_ROOT_PUBLIC=${SPACKLOT_TMPROOT}/$USER/spack-tests/$SPACKLOT_HOST
fi

SPACKLOT_ROOT_DEPLOYMENT=$SPACKLOT_ROOT_PUBLIC/$SPACKLOT_HOST_VERSION
SPACKLOT_ROOT_ENVS=$SPACKLOT_ROOT_DEPLOYMENT/envs
SPACKLOT_ROOT_PACKAGES_BUILTIN=$SPACKLOT_ROOT_DEPLOYMENT/packages/builtin
SPACKLOT_ROOT_BOOTSTRAP=$SPACKLOT_ROOT_DEPLOYMENT/bootstrap
SPACKLOT_BRANCH_SPACK=
SPACKLOT_BRANCH_PACKAGES_BUILTIN=
SPACKLOT_MIRROR_GLOBAL=/glade/u/apps/mirror/common
SPACKLOT_PYTHON_ROOT=/glade/work/csgteam/condaenvs/spack-utils

# Dependent variables
SPACKLOT_ENV_BUILD=$SPACKLOT_ROOT_ENVS/build
SPACKLOT_ENV_PUBLIC=$SPACKLOT_ROOT_ENVS/public
SPACKLOT_MIRROR_LOCAL=$SPACKLOT_ROOT_PUBLIC/mirror
SPACKLOT_ROOT_BASE=$SPACKLOT_ROOT_DEPLOYMENT/opt
